plugins {
  id("org.springdoc.openapi-gradle-plugin") version "1.9.0"
  id("org.openapi.generator") version "7.13.0"
}

group = 'com'
version = '0.0.1-SNAPSHOT'

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

dependencies {
  implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.8'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-webflux'
  implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
  compileOnly 'org.projectlombok:lombok'
  runtimeOnly 'org.postgresql:postgresql'
  annotationProcessor 'org.projectlombok:lombok'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'io.projectreactor:reactor-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApi {
	apiDocsUrl.set("http://127.0.0.1:9000/v3/api-docs")
  customBootRun {
		args.set(["--server.port=9000"])
	}
}

def openApiGeneratePackagePrefix = "com.sct.system.client"

openApiGenerate {
  generatorName.set("spring")
  inputSpec.set(file("$buildDir/openapi.json").toURI().toString())
  configOptions.set([
    apiPackage: "${openApiGeneratePackagePrefix}.api",
    configPackage: "${openApiGeneratePackagePrefix}.config",
    library: "spring-http-interface", // For Spring HTTP Interface following options are disabled: documentProvider, annotationLibrary, useBeanValidation, performBeanValidation. useJakartaEe defaulted to 'true'
    modelPackage: "${openApiGeneratePackagePrefix}.model",
    reactive: "true",
    useResponseEntity: "false"
  ])
  templateDir.set("$rootDir/openapi-generator/src/main/resources/JavaSpring")
  typeMappings.set([
    "local-time": "LocalTime",
    "local-date-time": "LocalDateTime",
    "instant": "Instant",
  ])
  importMappings.set([
    "LocalTime": "java.time.LocalTime",
    "LocalDateTime": "java.time.LocalDateTime",
    "Instant": "java.time.Instant",
  ])
}

tasks.named("openApiGenerate").configure {
  dependsOn tasks.named("generateOpenApiDocs")
}

task openapiGenerateAndCleanCopy(type: Copy) {
  dependsOn tasks.named("openApiGenerate")
  from "$buildDir/generate-resources/main/src/main/java"
  into "$rootDir/repositories/system-repository-client/src/main/java"
  doFirst {
    delete fileTree(dir: destinationDir, include: "**/*")
  }
}

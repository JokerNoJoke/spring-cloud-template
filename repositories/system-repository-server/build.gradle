plugins {
  id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
  id "org.openapi.generator" version "7.17.0"
}

group = 'com'
version = '0.0.1-SNAPSHOT'

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

dependencies {
  implementation 'org.springdoc:springdoc-openapi-starter-webflux-api'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-webflux'
  implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
  compileOnly 'org.projectlombok:lombok'
  runtimeOnly 'org.postgresql:postgresql'
  annotationProcessor 'org.projectlombok:lombok'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'io.projectreactor:reactor-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApi {
	apiDocsUrl.set("http://127.0.0.1:9000/v3/api-docs")
  customBootRun {
		args.set(["--server.port=9000"])
	}
}

def openApiGeneratePackagePrefix = "com.sct.system.client"

openApiGenerate {
  generatorName.set("spring")
  inputSpec.set("$buildDir/openapi.json")
  configOptions.set([
    apiPackage: "${openApiGeneratePackagePrefix}.api",
    configPackage: "${openApiGeneratePackagePrefix}.config",
    library: "spring-http-interface", // For Spring HTTP Interface following options are disabled: documentProvider, annotationLibrary, useBeanValidation, performBeanValidation. useJakartaEe defaulted to 'true'
    modelPackage: "${openApiGeneratePackagePrefix}.model",
  ])
  typeMappings.set([
    "local-time": "LocalTime",
    "local-date-time": "LocalDateTime",
    "instant": "Instant",
  ])
  importMappings.set([
    "LocalTime": "java.time.LocalTime",
    "LocalDateTime": "java.time.LocalDateTime",
    "Instant": "java.time.Instant",
  ])
}

tasks.named("openApiGenerate") {
  dependsOn tasks.named("generateOpenApiDocs")
  doLast {
    def configFile = file("$buildDir/generate-resources/main/src/main/java/com/sct/system/client/config/HttpInterfacesAbstractConfigurator.java")
    if (configFile.exists()) {
      def content = configFile.text
      content = content.replace("HttpServiceProxyFactory.builder(WebClientAdapter.forClient(webClient)).build()", "HttpServiceProxyFactory.builderFor(WebClientAdapter.create(webClient)).build()")
      configFile.text = content
    }
    
    def apiDir = file("$buildDir/generate-resources/main/src/main/java/com/sct/system/client/api")
    if (apiDir.exists()) {
      apiDir.eachFile { apiFile ->
        if (apiFile.name.endsWith(".java")) {
          def content = apiFile.text
          if (content.contains("@Parameter") && !content.contains("import io.swagger.v3.oas.annotations.Parameter;")) {
            content = content.replace("import jakarta.annotation.Generated;", "import jakarta.annotation.Generated;\nimport io.swagger.v3.oas.annotations.Parameter;\nimport io.swagger.v3.oas.annotations.enums.ParameterIn;")
            apiFile.text = content
          }
        }
      }
    }
  }
}

task openapiBuild(type: Copy) {
  dependsOn tasks.named("openApiGenerate")
  from "$buildDir/generate-resources/main/src/main/java"
  into "$rootDir/repositories/system-repository-client/src/main/java"
  doFirst {
    delete fileTree(dir: destinationDir, include: "**/*")
  }
}

server:
  port: 0

spring:
  application:
    name: system-repository-server
  cloud:
    consul:
      host: 127.0.0.1
      port: 8500
      discovery:
        prefer-ip-address: true
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/spring-cloud-template
    username: spring-cloud-template
    password: 123456
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    show-sql: true
